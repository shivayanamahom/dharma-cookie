PLG_SYSTEM_DHARMACOOKIE="Система — Dharma Cookie"
PLG_SYSTEM_DHARMACOOKIE_DESCRIPTION="Лёгкое уведомление об использовании куки: заголовок, текст со ссылками и одна кнопка. Без зависимостей, без базы данных, баннер строится в браузере и не мешает кэшу страниц. Ссылка или кнопка с атрибутом data-cookie-settings (например, в подвале) снова показывает баннер. Если поля текстов пусты, берутся тексты по умолчанию на языке сайта."

PLG_SYSTEM_DHARMACOOKIE_FIELDSET_BASIC="Основные"
PLG_SYSTEM_DHARMACOOKIE_TEST_MODE="Тестовый режим"
PLG_SYSTEM_DHARMACOOKIE_TEST_MODE_DESC="Баннер показывается при каждой загрузке страницы, куку согласия плагин не проверяет. Для проверки на тестовом сайте; на рабочем отключите."
PLG_SYSTEM_DHARMACOOKIE_POLICY_VERSION="Версия политики"
PLG_SYSTEM_DHARMACOOKIE_POLICY_VERSION_DESC="Хранится в куке согласия. Измените значение (например, 1 на 2), и баннер снова появится у всех посетителей."
PLG_SYSTEM_DHARMACOOKIE_LIFETIME="Срок хранения согласия, дней"
PLG_SYSTEM_DHARMACOOKIE_LIFETIME_DESC="Сколько дней браузер помнит, что посетитель нажал «ОК» (от 1 до 730)."

PLG_SYSTEM_DHARMACOOKIE_FIELDSET_TEXTS="Тексты"
PLG_SYSTEM_DHARMACOOKIE_FIELDSET_TEXTS_DESC="Как сделать ссылку: в поле «Текст» возьмите слова в квадратные скобки, например [файлов cookie]. Первое слово в скобках станет ссылкой на «Адрес первой ссылки», второе — на «Адрес второй ссылки». Если адрес не указан, слово выводится без ссылки. Новая строка в тексте — новый абзац. Если очистить поле, на сайте будет текст по умолчанию."
PLG_SYSTEM_DHARMACOOKIE_TEXT="Текст"
PLG_SYSTEM_DHARMACOOKIE_TEXT_DESC="Слова в [квадратных скобках] станут ссылками по порядку: первое — на адрес первой ссылки, второе — на адрес второй. Каждая новая строка — новый абзац."
PLG_SYSTEM_DHARMACOOKIE_LINK1_URL="Адрес первой ссылки"
PLG_SYSTEM_DHARMACOOKIE_LINK2_URL="Адрес второй ссылки"
PLG_SYSTEM_DHARMACOOKIE_LINK_URL_DESC="Путь от корня сайта (/politika) или полный адрес https://…. Если пусто, слово в скобках выводится обычным текстом."
PLG_SYSTEM_DHARMACOOKIE_TITLE="Заголовок"
PLG_SYSTEM_DHARMACOOKIE_BUTTON_TEXT="Текст кнопки"

PLG_SYSTEM_DHARMACOOKIE_FIELDSET_APPEARANCE="Внешний вид"
PLG_SYSTEM_DHARMACOOKIE_POSITION="Положение"
PLG_SYSTEM_DHARMACOOKIE_POSITION_BL="Карточка внизу слева"
PLG_SYSTEM_DHARMACOOKIE_POSITION_BR="Карточка внизу справа"
PLG_SYSTEM_DHARMACOOKIE_POSITION_BAR="Панель внизу на всю ширину"
PLG_SYSTEM_DHARMACOOKIE_THEME="Тема"
PLG_SYSTEM_DHARMACOOKIE_THEME_DARK="Тёмная"
PLG_SYSTEM_DHARMACOOKIE_THEME_LIGHT="Светлая"
PLG_SYSTEM_DHARMACOOKIE_BUTTON_CLASS="Класс кнопки"
PLG_SYSTEM_DHARMACOOKIE_BUTTON_CLASS_DESC="CSS-классы кнопки через пробел. Если поле заполнено, собственный вид кнопки плагина отключается и работают только эти классы, например knopka ripple-hover — как у кнопки «Обратный звонок» в шапке. Допустимы буквы, цифры, дефис и подчёркивание."
PLG_SYSTEM_DHARMACOOKIE_BUTTON_ICON_CLASS="Класс значка в кнопке"
PLG_SYSTEM_DHARMACOOKIE_BUTTON_ICON_CLASS_DESC="Необязательно. Добавляет в конец кнопки пустой элемент span с этим классом, например ar-arrow даёт стрелку, как у кнопки «Обратный звонок»."
PLG_SYSTEM_DHARMACOOKIE_CUSTOM_CSS="Свой CSS"
PLG_SYSTEM_DHARMACOOKIE_CUSTOM_CSS_DESC="Дополнительные правила. Акцентный цвет кнопки берётся из переменной шаблона --dharma-primary; фон и цвет текста — из --dck-bg и --dck-fg у класса .dck."

PLG_SYSTEM_DHARMACOOKIE_DEFAULT_TITLE="Мы используем куки и рекомендательные технологии"
PLG_SYSTEM_DHARMACOOKIE_DEFAULT_TEXT="Это помогает сайту работать лучше.\nПродолжая пользоваться сайтом, вы соглашаетесь на использование [файлов cookie]."
PLG_SYSTEM_DHARMACOOKIE_DEFAULT_BUTTON="Понятно"
