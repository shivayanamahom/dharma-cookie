PLG_SYSTEM_DHARMACOOKIE="System - Dharma Cookie"
PLG_SYSTEM_DHARMACOOKIE_DESCRIPTION="Lightweight cookie notice: a title, text with links and one button. No dependencies, no database; the banner is built in the browser and does not break page caching. A link or button with the data-cookie-settings attribute (for example in the footer) shows the banner again. Empty text fields fall back to the default texts in the site language."

PLG_SYSTEM_DHARMACOOKIE_FIELDSET_BASIC="Basic"
PLG_SYSTEM_DHARMACOOKIE_TEST_MODE="Test mode"
PLG_SYSTEM_DHARMACOOKIE_TEST_MODE_DESC="The banner is shown on every page load and the consent cookie is ignored. For checking on a test site; turn it off on production."
PLG_SYSTEM_DHARMACOOKIE_POLICY_VERSION="Policy version"
PLG_SYSTEM_DHARMACOOKIE_POLICY_VERSION_DESC="Stored in the consent cookie. Change the value (for example 1 to 2) and the banner appears again for every visitor."
PLG_SYSTEM_DHARMACOOKIE_LIFETIME="Consent lifetime, days"
PLG_SYSTEM_DHARMACOOKIE_LIFETIME_DESC="How many days the browser remembers that the visitor clicked OK (1 to 730)."

PLG_SYSTEM_DHARMACOOKIE_FIELDSET_TEXTS="Texts"
PLG_SYSTEM_DHARMACOOKIE_FIELDSET_TEXTS_DESC="How to make a link: in the Text field put words in square brackets, for example [cookies]. The first bracketed word links to the first link address, the second to the second link address. If no address is set, the word is shown as plain text. A new line in the text is a new paragraph. If you clear a field, the default text is used on the site."
PLG_SYSTEM_DHARMACOOKIE_TEXT="Text"
PLG_SYSTEM_DHARMACOOKIE_TEXT_DESC="Words in [square brackets] become links in order: the first to the first link address, the second to the second. Each new line is a new paragraph."
PLG_SYSTEM_DHARMACOOKIE_LINK1_URL="First link address"
PLG_SYSTEM_DHARMACOOKIE_LINK2_URL="Second link address"
PLG_SYSTEM_DHARMACOOKIE_LINK_URL_DESC="A path from the site root (/policy) or a full https://... URL. If empty, the bracketed word is shown as plain text."
PLG_SYSTEM_DHARMACOOKIE_TITLE="Title"
PLG_SYSTEM_DHARMACOOKIE_BUTTON_TEXT="Button text"

PLG_SYSTEM_DHARMACOOKIE_FIELDSET_APPEARANCE="Appearance"
PLG_SYSTEM_DHARMACOOKIE_POSITION="Position"
PLG_SYSTEM_DHARMACOOKIE_POSITION_BL="Card, bottom left"
PLG_SYSTEM_DHARMACOOKIE_POSITION_BR="Card, bottom right"
PLG_SYSTEM_DHARMACOOKIE_POSITION_BAR="Full-width bar at the bottom"
PLG_SYSTEM_DHARMACOOKIE_THEME="Theme"
PLG_SYSTEM_DHARMACOOKIE_THEME_DARK="Dark"
PLG_SYSTEM_DHARMACOOKIE_THEME_LIGHT="Light"
PLG_SYSTEM_DHARMACOOKIE_BUTTON_CLASS="Button class"
PLG_SYSTEM_DHARMACOOKIE_BUTTON_CLASS_DESC="CSS classes for the button, space-separated. If filled in, the plugin's own button look is turned off and only these classes apply, for example knopka ripple-hover to match the header callback button. Letters, digits, hyphen and underscore are allowed."
PLG_SYSTEM_DHARMACOOKIE_BUTTON_ICON_CLASS="Button icon class"
PLG_SYSTEM_DHARMACOOKIE_BUTTON_ICON_CLASS_DESC="Optional. Adds an empty span with this class to the end of the button, for example ar-arrow gives the arrow of the header callback button."
PLG_SYSTEM_DHARMACOOKIE_CUSTOM_CSS="Custom CSS"
PLG_SYSTEM_DHARMACOOKIE_CUSTOM_CSS_DESC="Extra rules. The button accent colour comes from the template variable --dharma-primary; background and text colour come from --dck-bg and --dck-fg on the .dck class."

PLG_SYSTEM_DHARMACOOKIE_DEFAULT_TITLE="We use cookies and recommendation technologies"
PLG_SYSTEM_DHARMACOOKIE_DEFAULT_TEXT="This helps the site work better.\nBy continuing to use the site, you agree to the use of [cookies]."
PLG_SYSTEM_DHARMACOOKIE_DEFAULT_BUTTON="OK"
